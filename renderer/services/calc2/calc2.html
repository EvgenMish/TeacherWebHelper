<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="
        default-src 'self';
        script-src 'self';
        style-src 'self' 'unsafe-inline';
        img-src 'self' data:;
        font-src 'self';
      "
    />
    <title>Взвешенное среднее ☠</title>
    <link rel="stylesheet" href="../../shared/css/style.css" />
  </head>
  <body>
    <!-- Сайдбар -->
    <div id="sidebar-placeholder"></div>

    <div class="content-wrapper">
      <h1>Калькулятор взвешенного среднего</h1>

      <table id="calc2Table" , style="table-layout: fixed">
        <colgroup>
          <col style="width: calc((100% - 50px) / 2)" />
          <!-- оценка -->
          <col style="width: calc((100% - 50px) / 2)" />
          <!-- вес -->
          <col style="width: 50px" />
        </colgroup>
        <thead>
          <tr>
            <th>Оценка</th>
            <th>Вес</th>
            <th></th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>

      <h2>Результат:</h2>
      <div id="resultDisplay">-</div>

      <h2>А можна чота вам сделать? ☠</h2>
      <div class="combinations-block">
        <div class="controls">
          <label>
            Хотят в журнале:
            <select
              id="targetMean"
              style="
                width: 80px;
                padding: 6px 8px;
                border-radius: 6px;
                border: 1px solid #555;
                background-color: #1e1e1e;
                color: #e0e0e0;
                font-size: 1em;
              "
            >
              <option value="auto">Авто</option>
              <option value="3">3</option>
              <option value="4">4</option>
              <option value="5">5</option>
            </select>
          </label>
        </div>

        <div class="controls">
          <label>
            Кол-во новых оценок:
            <input type="number" id="nNewGrades" value="1" min="1" max="5" />
          </label>
          <button id="findBtn">Найти комбинацию</button>
        </div>
      </div>

      <div id="solutions"></div>

      <div class="back-button-container">
        <button class="back-button" data-href="../../index.html">
          ← Назад
        </button>
      </div>

      <script src="calc2.js"></script>
      <script src="../../sidebar.js"></script>
      <script src="../../titlebar.js"></script>
    </div>
  </body>
</html>
