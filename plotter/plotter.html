<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <title>График функций Desmos</title>
    <script src="https://www.desmos.com/api/v1.6/calculator.js"></script>
    <style>
      body {
        font-family: sans-serif;
        padding: 20px;
        background: #121212;
        color: #e0e0e0;
      }
      #plot {
        width: 90%;
        height: 500px;
        border: 1px solid #555;
        margin-top: 20px;
      }
      input {
        padding: 5px;
        font-size: 1em;
        width: 200px;
        margin-right: 5px;
        background: #1e1e1e;
        color: #e0e0e0;
        border: 1px solid #555;
        border-radius: 4px;
      }
      button {
        padding: 5px 10px;
        border: none;
        border-radius: 4px;
        cursor: pointer;
        background: #4caf50;
        color: #fff;
      }
      button:hover {
        background: #45a049;
      }
      .func-row {
        margin-bottom: 5px;
        display: flex;
        align-items: center;
      }
    </style>
  </head>
  <body>
    <h1>График функций Desmos</h1>

    <div id="functions-container">
      <div class="func-row">
        <input type="text" class="func-input" placeholder="x^2 + sin(x)" />
        <button onclick="removeFunction(this)">×</button>
      </div>
    </div>

    <button onclick="addFunction()">Добавить функцию</button>
    <button id="plot-btn">Построить графики</button>

    <div id="plot"></div>

    <script src="plotter.js"></script>
  </body>
</html>
