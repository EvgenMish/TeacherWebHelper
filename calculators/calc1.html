<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <title>Калькулятор оценок</title>
    <link rel="stylesheet" href="../css/style.css" />
  </head>
  <body>
    <h1>Калькулятор оценок ⚠</h1>

    <div class="score-row">
      <label>
        Набрано
        <input id="score" type="number" placeholder="0" />
        баллов из
        <input id="max" type="number" placeholder="100" />
      </label>
    </div>

    <h2>Результат:</h2>
    <div id="resultDisplay">-</div>

    <table id="thresholdTable">
      <thead>
        <tr>
          <th>Оценка</th>
          <th>Мин. %</th>
          <th>Мин. балл</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>

    <!-- кнопка назад -->
    <div class="back-button-container">
      <button
        class="back-button"
        onclick="window.location.href='../index.html'"
      >
        ← Назад
      </button>
    </div>

    <script src="calc1.js"></script>
  </body>
</html>
