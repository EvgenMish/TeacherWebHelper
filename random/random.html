<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Рулетка</title>
    <link rel="stylesheet" href="../css/style.css" />
    <style>
      /* Таблица в стиле calc2 */
      #stringInputBlock table {
        width: 100%; /* теперь занимает всю ширину контейнера */
      }
      #stringInputBlock {
        width: 50%; /* растянуть контейнер на всю ширину окна */
        max-width: 800px;
        box-sizing: border-box;
      }

      #stringInputBlock th {
        background-color: #333;
        color: #fff;
        font-weight: 600;
        padding: 12px;
        text-align: center;
      }

      #stringInputBlock td {
        padding: 10px;
        border-bottom: 1px solid #333;
      }

      #stringInputBlock tr:nth-child(even) {
        background-color: #2a2a2a;
      }

      #stringInputBlock tr:hover {
        background-color: #3a3a3a;
      }

      /* Поля ввода */
      #stringTable input.string-input {
        width: 100%;
        padding: 6px 10px;
        border-radius: 10px;
        border: 1px solid #555;
        background-color: #1e1e1e;
        color: #e0e0e0;
        font-size: 1em;
        transition: all 0.2s;
      }

      #stringTable input.string-input:focus {
        border-color: #4caf50;
        box-shadow: 0 0 5px rgba(76, 175, 80, 0.5);
        outline: none;
      }

      #stringInputBlock td:last-child {
        width: 50px; /* фиксированная ширина колонки с кнопкой */
        text-align: right; /* центрируем кнопку */
      }

      /* Кнопка добавления строки */
      #addRowBtn {
        display: block;
        width: 100%;
        max-width: 800px;
        margin: 10px auto;
        background-color: #1e1e1e;
        color: #555;
        font-size: 1.2em;
        font-weight: bold;
        border: 1px solid #555;
        border-radius: 10px;
        padding: 12px 0;
        cursor: pointer;
        transition: all 0.2s;
      }

      #addRowBtn:hover {
        background-color: #555;
        color: #fff;
        transform: translateY(-2px);
        box-shadow: 0 4px 6px rgba(0, 0, 0, 0.2);
      }

      /* Подсветка выбранной строки */
      #stringInputBlock tbody tr:nth-child(even) {
        background-color: #2a2a2a;
      }

      #stringInputBlock tbody tr:hover {
        background-color: #3a3a3a;
      }

      #stringInputBlock tbody tr.highlight {
        background-image: linear-gradient(
          to right,
          rgba(141, 141, 141, 1),
          rgba(141, 141, 141, 0)
        );
        color: #000 !important;
      }

      
    </style>
  </head>
  <body>
    <div id="sidebar-placeholder"></div>

    <div class="content-wrapper">

        <h1>Рулетка</h1>

        <div class="mode-toggle">
        <button id="numberMode" class="toggle-btn">Число</button>
        <button id="stringMode" class="toggle-btn active">Строка</button>
        </div>

        <!-- Блок числа -->
        <div
        id="numberInputBlock"
        style="display: none; margin-top: 20px; text-align: center"
        >
        <label
            >Введите максимальное число:
            <input type="number" id="maxNumber" min="1" value="10" />
        </label>
        <br /><br />
        <button class="calc-button" id="pickNumber">
            Выбрать!
        </button>
        </div>

        <!-- Блок строк -->
        <div
        id="stringInputBlock"
        style="display: none; margin-top: 20px; text-align: center"
        >
        <table id="stringTable">
            <thead>
                <tbody></tbody>
            </thead>
            <tbody></tbody>
        </table>
        <button id="addRowBtn">Добавить / Enter</button>
        <button
            class="calc-button"
            id="pickString"
            style="margin: 24px auto; display: block; width: 100%; max-width: 250px"
        >
            Выбрать!
        </button>
        </div>

        <div id="resultDisplay"></div>

        <div class="back-button-container">
        <button
            class="back-button"
            onclick="window.location.href='../index.html'"
        >
            ← Назад
        </button>
        </div>

        <script src="random.js"></script>

        <script>
            function openCalculator(page) {
                window.location.href = `../calculators/${page}`;
            }

            // Подгрузка сайдбара и разворачивание при наведении
            fetch("../sidebar.html")
                .then((res) => res.text())
                .then((html) => {
                const sidebarContainer = document.getElementById("sidebar-placeholder");
                sidebarContainer.innerHTML = html;

                const sidebar = sidebarContainer.querySelector(".sidebar");

                // Разворачивание при наведении
                sidebar.addEventListener("mouseenter", () => {
                    sidebar.classList.add("expanded");
                });
                sidebar.addEventListener("mouseleave", () => {
                    sidebar.classList.remove("expanded");
                });
                })
                .catch((err) => console.error("Ошибка загрузки сайдбара:", err));
        </script>
    </div>
  </body>
</html>
