<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <title>Выбор калькулятора</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <h1>Выбери калькулятор, Женечка</h1>

    <div class="buttons-container">
      <button class="calc-button" onclick="openCalculator('calc1.html')">
        Калькулятор оценок
      </button>
      <button class="calc-button" onclick="openCalculator('calc2.html')">
        Взвешенное среднее
      </button>
      <button
        class="calc-button"
        onclick="window.location.href='random/random.html'"
      >
        Рулетка
      </button>
    </div>

    <script>
      function openCalculator(page) {
        window.location.href = `calculators/${page}`;
      }
    </script>
  </body>
</html>
